services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always

    ports:
      - "9443:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

    networks:
      - homelab-proxy

volumes:
  portainer_data:

networks:
  homelab-proxy:
    external: true
