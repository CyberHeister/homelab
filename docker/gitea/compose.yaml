services:
  gitea:
    image: docker.gitea.com/gitea:1.27.2
    container_name: gitea
    restart: unless-stopped

    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=Asia/Kolkata

    ports:
      - "3000:3000"
      - "2222:22"

    volumes:
      - /opt/homelab/data/gitea:/data

    networks:
      - homelab

networks:
  homelab:
    external: true
