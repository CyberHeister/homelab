services:
  linkding:
    image: sissbruecker/linkding:latest
    container_name: linkding
    restart: unless-stopped

    environment:
      LD_SUPERUSER_NAME: admin
      LD_SUPERUSER_PASSWORD: CHANGE_THIS_PASSWORD
      LD_DISABLE_BACKGROUND_TASKS: "False"

    volumes:
      - /home/malya/homelab/homelab/data/linkding:/etc/linkding/data

    networks:
      - homelab-proxy

networks:
  homelab-proxy:
    external: true
