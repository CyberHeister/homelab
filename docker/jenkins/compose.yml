services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: jenkins
    restart: unless-stopped

    command:
      - --prefix=/jenkins

    ports:
      - "127.0.0.1:8080:8080"
    group_add:
      - "983"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      - TZ=Asia/Kolkata

    networks:
      - homelab-proxy

volumes:
  jenkins_home:

networks:
  homelab-proxy:
    external: true
