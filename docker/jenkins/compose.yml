services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins
    restart: unless-stopped

    command:
      - --prefix=/jenkins

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - jenkins_home:/var/jenkins_home

    environment:
      - TZ=Asia/Kolkata

    networks:
      - homelab-proxy

volumes:
  jenkins_home:

networks:
  homelab-proxy:
    external: true
