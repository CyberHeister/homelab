services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d

    volumes:
      - /home/malya/homelab/homelab/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /home/malya/homelab/homelab/data/prometheus:/prometheus

    networks:
      - homelab-proxy

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped

    command:
      - --path.rootfs=/host

    volumes:
      - /:/host:ro,rslave

    networks:
      - homelab-proxy

networks:
  homelab-proxy:
    external: true
