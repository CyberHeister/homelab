services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - APP_URL=https://bookstack.home.arpa
      - APP_KEY=base64:6AOLzOSnOcY0mRchn/RL8/YlFW++THsnoPPhL2rbzZw=
      - DB_HOST=bookstack-db
      - DB_PORT=3306
      - DB_USERNAME=bookstack
      - DB_PASSWORD=nigamalya16
      - DB_DATABASE=bookstack

    volumes:
      - /home/malya/homelab/homelab/data/bookstack:/config

    depends_on:
      bookstack-db:
        condition: service_healthy

    networks:
      - homelab-proxy

  bookstack-db:
    image: mariadb:11
    container_name: bookstack-db
    restart: unless-stopped

    environment:
      - MYSQL_ROOT_PASSWORD=nigadebu16
      - MYSQL_DATABASE=bookstack
      - MYSQL_USERNAME=bookstack
      - MYSQL_PASSWORD=nigamalya16

    volumes:
      - /home/malya/homelab/homelab/data/bookstack-db:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - homelab-proxy

networks:
  homelab-proxy:
    external: true
